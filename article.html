<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <title>文章內容</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-page="article">
    <header class="site-header">
      <div class="container header-inner">
        <div class="site-logo">
          <a href="index.html" id="site-logo-text"></a>
        </div>
        <nav class="site-nav">
          <ul id="nav-list"></ul>
        </nav>
        <div class="lang-switch" id="lang-switch"></div>
      </div>
    </header>

    <main class="container">
      <section class="page-header">
        <h1 id="article-title"></h1>
        <nav class="breadcrumb" id="breadcrumb"></nav>
        <p class="article-date" id="article-date"></p>
      </section>

      <!-- 正文區 -->
      <article id="article-content" class="article-content"></article>

      <!-- 如果是影片文章，這裡會有 YouTube -->
      <div id="article-youtube" class="article-youtube"></div>
    </main>

    <footer class="site-footer">
      <div class="container footer-grid">
        <div>
          <h4 id="footer-contact-title"></h4>
          <p id="footer-contact"></p>
        </div>
        <div>
          <h4 id="footer-links-title"></h4>
          <ul id="footer-links"></ul>
        </div>
        <div>
          <h4 id="footer-register-title"></h4>
          <ul id="footer-register"></ul>
        </div>
      </div>
      <div class="container footer-bottom">
        <p id="footer-copy"></p>
        <p>建議使用 Chrome、Firefox、Safari 最新版本瀏覽</p>
      </div>
    </footer>

    <script src="js/main.js"></script>
  </body>
</html>

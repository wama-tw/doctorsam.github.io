<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <title>吳博貴醫師 醫學博士</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-page="home">
    <header class="site-header">
      <div class="container header-inner">
        <div class="site-logo">
          <a href="index.html" id="site-logo-text"></a></span>
        </div>
        <nav class="site-nav">
          <ul id="nav-list"></ul>
        </nav>
        <div class="lang-switch" id="lang-switch"></div>
      </div>
    </header>

    <main>
      <!-- Hero 區 -->
      <section id="home-hero" class="home-hero">
        <div class="container">
          <!-- JS 會填入 h1 / p -->
        </div>
      </section>

      <!-- 醫師介紹 -->
      <section id="home-about" class="home-about">
        <div class="container">
          <!-- JS 會填入標題、段落、經歷列表 -->
        </div>
      </section>

      <!-- 研究中心介紹 + 數據 -->
      <section id="home-center" class="home-center">
        <div class="container">
          <!-- JS 會填入標題、副標、數據 -->
        </div>
      </section>

      <!-- 病症說明查詢指南 -->
      <section id="home-disease-guide" class="home-disease-guide">
        <div class="container">
          <!-- JS 會產生卡片 -->
        </div>
      </section>

      <!-- 願與民眾分享... -->
      <section id="home-sharing" class="home-sharing">
        <div class="container">
          <!-- JS 會填文字 -->
        </div>
      </section>

      <!-- 醫病互動預覽 -->
      <section id="home-interaction" class="home-interaction">
        <div class="container">
          <!-- JS 會產生成 4 個卡片 -->
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container footer-grid">
        <div>
          <h4 id="footer-contact-title"></h4>
          <p id="footer-contact"></p>
        </div>
        <div>
          <h4 id="footer-links-title"></h4>
          <ul id="footer-links"></ul>
        </div>
        <div>
          <h4 id="footer-register-title"></h4>
          <ul id="footer-register"></ul>
        </div>
      </div>
      <div class="container footer-bottom">
        <p id="footer-copy"></p>
        <p>建議使用 Chrome、Firefox、Safari 最新版本瀏覽</p>
      </div>
    </footer>

    <script src="js/main.js"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <title>常見問題</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-page="faq">
    <header class="site-header">
      <div class="container header-inner">
        <div class="site-logo">
          <a href="index.html" id="site-logo-text"></a>
        </div>
        <nav class="site-nav">
          <ul id="nav-list"></ul>
        </nav>
        <div class="lang-switch" id="lang-switch"></div>
      </div>
    </header>

    <main class="container faq-layout">
      <!-- 左側分類 -->
      <aside class="faq-sidebar">
        <h2>問題分類</h2>
        <ul id="faq-category-list"></ul>
      </aside>

      <!-- 右側內容 -->
      <section class="faq-main">
        <section class="page-header">
          <h1 id="page-title"></h1>
          <nav class="breadcrumb" id="breadcrumb"></nav>
        </section>

        <!-- 頁面簡介 -->
        <section id="faq-intro" class="page-content"></section>

        <!-- 問題列表 -->
        <section id="faq-list" class="faq-list"></section>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container footer-grid">
        <div>
          <h4 id="footer-contact-title"></h4>
          <p id="footer-contact"></p>
        </div>
        <div>
          <h4 id="footer-links-title"></h4>
          <ul id="footer-links"></ul>
        </div>
        <div>
          <h4 id="footer-register-title"></h4>
          <ul id="footer-register"></ul>
        </div>
      </div>
      <div class="container footer-bottom">
        <p id="footer-copy"></p>
        <p>建議使用 Chrome、Firefox、Safari 最新版本瀏覽</p>
      </div>
    </footer>

    <script src="js/main.js"></script>
  </body>
</html>
